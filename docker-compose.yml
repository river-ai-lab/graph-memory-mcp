# ArcadeDB (default) and FalkorDB for local dev and tests.
# Matches env.example credentials (GRAPH_BACKEND=arcadedb).
#
#   docker compose up -d
#   docker compose down
#
# Token mode (the MCP process, not these DB services):
#   environment:
#     OWNER_SCOPE: token
#     ADMIN_TOKEN: ${ADMIN_TOKEN}
#     API_KEYS_FILE: /run/keys.json
#   volumes:
#     - ./keys.json:/run/keys.json:ro
#
services:
  falkordb:
    image: falkordb/falkordb
    container_name: graph-memory-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    environment:
      # AOF persistence: survive container crashes with at most ~1s of writes lost.
      REDIS_ARGS: "--requirepass falkordb123 --appendonly yes --appendfsync everysec"
    volumes:
      - ./data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "falkordb123", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  arcadedb:
    image: arcadedata/arcadedb:26.10.2
    container_name: graph-memory-arcadedb
    ports:
      - "2480:2480"
      - "2424:2424"
    environment:
      # First start asks for a password unless this property is set.
      JAVA_OPTS: "-Darcadedb.server.rootPassword=playwithdata"
    volumes:
      # Named volume. The image runs as user arcadedb and owns
      # /home/arcadedb/databases. A fresh ./data-arcade bind is root-owned,
      # so the server cannot create databases. FalkorDB above runs as root
      # and writes its ./data bind mount.
      - arcade-data:/home/arcadedb/databases
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2480/api/v1/ready || curl -f http://localhost:2480/api/v1/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  arcade-data:
