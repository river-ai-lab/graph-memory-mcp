name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb
        ports:
          - 6379:6379
        env:
          REDIS_ARGS: "--requirepass falkordb123"
        options: >-
          --health-cmd "redis-cli -a falkordb123 ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: falkordb123
      FALKORDB_GRAPH: memory_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-base-onnx
      - run: uv sync --extra torch
      - run: uv run pytest -q -m "not arcade and not browser"

  arcade:
    runs-on: ubuntu-latest
    services:
      arcadedb:
        image: arcadedata/arcadedb:latest
        ports:
          - 2480:2480
        env:
          JAVA_OPTS: "-Darcadedb.server.rootPassword=playwithdata"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Wait for ArcadeDB
        run: |
          for _ in $(seq 1 30); do
            curl -sf -u root:playwithdata http://127.0.0.1:2480/api/v1/server && exit 0
            sleep 2
          done
          exit 1
      - run: uv sync
      - run: uv run pytest -q -m "arcade and not browser"
