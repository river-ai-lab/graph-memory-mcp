[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-memory-mcp"
# Only version source. graph_memory_mcp.__version__ reads this from installed metadata.
version = "0.2.0"
description = "MCP server for graph-based long-term memory (FalkorDB or ArcadeDB)"
readme = "README_pypi.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marat Shikhragimov", email = "m.shikhragimov@gmail.com" }]
keywords = [
  "mcp",
  "memory",
  "knowledge-graph",
  "falkordb",
  "arcadedb",
  "embeddings",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2.3,<3",
  "redis>=5.2.1",
  "falkordb>=1.0.9",
  "numpy>=2.0.0",
  "onnxruntime>=1.20.0",
  "tokenizers>=0.20.0",
  "huggingface-hub>=0.26.0",
  "httpx>=0.28.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "apscheduler>=3.11.0",
  "uvicorn>=0.40.0",
  "python-dotenv>=1.0.1",
  "cachetools>=5.5.0",
  "prometheus-client>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/river-ai-lab/graph-memory-mcp"
Documentation = "https://github.com/river-ai-lab/graph-memory-mcp/tree/main/docs"
Repository = "https://github.com/river-ai-lab/graph-memory-mcp"
Changelog = "https://github.com/river-ai-lab/graph-memory-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/river-ai-lab/graph-memory-mcp/issues"

[project.scripts]
graph-memory-mcp = "graph_memory_mcp.cli:main"
graph-memory-explorer = "graph_memory_mcp.explorer.cli:main"

[project.optional-dependencies]
torch = [
  "torch>=2.12.0",
  "sentence-transformers>=3.3.1",
]

[tool.setuptools.package-data]
graph_memory_mcp = ["explorer/static/*", "resources/*.md"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_memory_mcp", "graph_memory_mcp.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

markers = [
  "integration: requires running FalkorDB (docker compose up -d)",
  "arcade: requires a running ArcadeDB server",
  "browser: headless Playwright UI smoke; skipped unless EXPLORER_BROWSER=1",
]

[tool.basedpyright]
# Standard layout: `graph_memory_mcp` package lives at the repo root.

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["graph_memory_mcp", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["graph_memory_mcp"]

# The optional torch extra is CPU-only (no NVIDIA/CUDA wheels on Linux).
[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff==0.17.0",
    "pytest",
    "pytest-asyncio",
    "httpx>=0.28.0",
]
